<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Cubes 3D Drop</title>
    
    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-wrapper">
        <!-- Header: Title and Scores -->
        <header class="ui-header">
            <div class="brand">
                <h1>Cubes 3D</h1>
            </div>
            <div class="score-board">
                <div class="score-card">
                    <div class="label">Score</div>
                    <div id="ui-current-score" class="value">0</div>
                </div>
                <div class="score-card">
                    <div class="label">Best</div>
                    <div id="ui-best-score" class="value">0</div>
                </div>
            </div>
        </header>

        <!-- Utilities: Control button and Next Preview -->
        <section class="ui-utilities">
            <button id="btn-restart-game" class="btn-action">Clear Save</button>
            <div class="next-preview">
                <span class="label">Next:</span>
                <div id="ui-next-preview-box" class="preview-cube-slot">2</div>
            </div>
        </section>

        <!-- Main 3D Container -->
        <main class="game-viewport-3d" id="game-viewport">
            <!-- WebGL Canvas Context -->
            <canvas id="webgl-render-target"></canvas>
            
            <!-- Aiming HUD Layer -->
            <div class="hud-overlay">
                <div id="aim-line" class="drop-guide-line"></div>
            </div>
        </main>
    </div>

    <!-- External Script Dependencies (Three.js and Physics Engines) -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>

    <!-- Custom Project Game Scripts -->
    <script src="cube-text-manager.js"></script>
    <script src="savemanager.js"></script>
    <script src="game.js"></script>
</body>
</html>
